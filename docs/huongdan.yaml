      - id: faq-accordion
        type: accordion
        title: "Giải đáp 5 tình huống thường gặp trong quá trình sử dụng"
        items:
          - title: "1. Nhập mã 6 số trên web báo 'Không tìm thấy thiết bị'?"
            text: "Nguyên nhân là Tivi hoặc Máy tính bảng của con chưa kết nối Wi-Fi khi mở ứng dụng lần đầu. Hãy kiểm tra kết nối Wi-Fi trên máy của con, mở lại ứng dụng `TQD KidGuard` để dòng trạng thái dưới mã 6 số hiện chữ `● Đã kết nối máy chủ Cloud`, sau đó bấm ghép nối lại trên điện thoại của bố mẹ."
          - title: "2. Đã khóa ứng dụng trên web nhưng con bấm vào trên Máy tính bảng vẫn mở được?"
            text: "Nguyên nhân là quyền Dịch vụ Trợ năng (`B3`) trên Máy tính bảng chưa được bật hoặc bị hệ thống thu hồi. Hãy mở ứng dụng `TQD KidGuard` trên Máy tính bảng và kiểm tra dòng `B3`: nếu đang màu cam thì bấm vào nút `B3` để gạt bật lại `TQD KidGuard` trong phần Trợ năng."
          - title: "3. Trên web không thấy hiện tên ứng dụng con đang mở?"
            text: "Nguyên nhân là chưa cấp Quyền Đọc Ứng Dụng Đang Chạy (`B1`) trên thiết bị. Hãy mở ứng dụng `TQD KidGuard` trên máy của con, bấm nút `B1` và gạt bật quyền truy cập dữ liệu sử dụng (`Usage Access`) cho ứng dụng."
          - title: "4. Quên mã PIN mở khóa màn hình khi thiết bị đang bị khóa?"
            text: "Mở `https://tv.tqd.me` trên điện thoại của bố mẹ -> bấm thẳng nút `🔓 Mở Khóa` màu xanh lá để mở máy ngay lập tức mà không cần nhập PIN trên màn hình của con, hoặc bấm `🔑 Đổi PIN` trên đầu trang web để đặt lại mã PIN mới."
          - title: "5. Làm sao chuyển giao diện Tivi từ chế độ đầy đủ sang chế độ gọn gàng (chỉ kiểm soát & khóa)?"
            text: "Trên `https://tv.tqd.me`, bấm nút `⚙️ Thiết bị` ở góc trên phải -> tại mục `Giao diện quản lý trên Web`, chọn chế độ `🛡️ Gọn gàng: Chỉ Kiểm Soát App + Chặn + Hẹn Giờ + Khóa PIN` rồi bấm `💾 Lưu Thay Đổi`."
